<div class="search-container" style="max-width: 1200px; margin: 3rem auto; padding: 0 1.5rem;">
    <div class="text-center" style="margin-bottom: 3.5rem;">
        <h1 class="hero-title" style="font-size: 3rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 1rem;">
            <span class="text-gradient">U-Car</span> Transport & Delivery
        </h1>
        <p class="hero-subtitle" style="font-size: 1.15rem; color: #6b7280; max-width: 600px; margin: 0 auto;" data-i18n-key="transport_subtitle">
            Request a transport for your purchased vehicle or apply as a driver.
        </p>
    </div>

    <div class="transport-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 2.5rem;">
        
        <!-- Request Transport Section -->
        <div class="glass-card" style="padding: 3rem 2.5rem; border-radius: 2.5rem; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; background: linear-gradient(135deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.1)); border: 1.5px solid rgba(255, 255, 255, 0.25);">
            <div style="position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: linear-gradient(90deg, #2563eb, #4f46e5);"></div>
            <div>
                <h2 style="font-size: 1.8rem; font-weight: 700; display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem;">
                    <i data-lucide="truck" style="color: #2563eb; width: 28px; height: 28px;"></i>
                    <span data-i18n-key="transport_req_title">Request Transport</span>
                </h2>
                
                <form id="transportRequestForm">
                    <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem;">
                        <label style="font-weight: 600; font-size: 0.9rem; color: var(--text-dark);" data-i18n-key="transport_req_url_label">Vehicle Listing URL</label>
                        <input type="url" id="transportUrl" class="pill-input" data-i18n-placeholder="transport_req_url_placeholder" placeholder="Paste link (e.g. from Cars.com, Autotrader...)" style="width: 100%; padding: 0.8rem 1.2rem; border-radius: 9999px; border: 1px solid rgba(0, 0, 0, 0.1); background: rgba(255, 255, 255, 0.5); font-family: inherit; font-size: 0.95rem;" />
                    </div>
                    
                    <div class="transport-or-divider" style="display: flex; align-items: center; text-align: center; margin: 1.5rem 0; color: #6b7280; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em;" data-i18n-key="transport_req_or">OR</div>
                    
                    <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem;">
                        <label style="font-weight: 600; font-size: 0.9rem; color: var(--text-dark);" data-i18n-key="transport_req_compare_label">Select from Compared/Liked Cars</label>
                        <select id="transportCompareSelect" class="glass-select" style="width: 100%; padding: 0.8rem 1.2rem; border-radius: 9999px; border: 1px solid rgba(0, 0, 0, 0.1); background: rgba(255, 255, 255, 0.5); font-family: inherit; font-size: 0.95rem; cursor: pointer;">
                            <option value="" disabled selected>-- Select a vehicle --</option>
                            <!-- Populated via JS -->
                        </select>
                    </div>

                    <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 2rem;">
                        <label style="font-weight: 600; font-size: 0.9rem; color: var(--text-dark);" data-i18n-key="transport_req_dest_label">Destination ZIP Code</label>
                        <input type="text" id="transportDestZip" class="pill-input" data-i18n-placeholder="transport_req_dest_placeholder" placeholder="e.g., 90210" required style="width: 100%; padding: 0.8rem 1.2rem; border-radius: 9999px; border: 1px solid rgba(0, 0, 0, 0.1); background: rgba(255, 255, 255, 0.5); font-family: inherit; font-size: 0.95rem;" />
                    </div>

                    <button type="submit" class="pill-btn primary" id="calculateFareBtn" style="width: 100%; justify-content: center; font-size: 1rem; padding: 14px;">
                        <i data-lucide="calculator"></i> <span data-i18n-key="transport_req_btn">Calculate Fare</span>
                    </button>
                </form>
            </div>

            <!-- Dynamic Result Area -->
            <div class="transport-fare-result" id="fareResultArea" style="margin-top: 2rem; display: none; padding: 1.5rem; background: rgba(37, 99, 235, 0.08); border: 1.5px dashed rgba(37, 99, 235, 0.25); border-radius: 1.5rem; text-align: center;">
                <p style="margin: 0 0 0.5rem 0; font-weight: 600; color: #6b7280;" data-i18n-key="transport_fare_est">Estimated Fare:</p>
                <h3 id="fareAmountDisplay" style="font-size: 2.5rem; font-weight: 800; color: #2563eb; margin: 0 0 1.25rem 0;">$0.00</h3>
                <button class="pill-btn success" id="acceptFareBtn" style="width: 100%; justify-content: center; font-size: 1rem; padding: 12px; background: linear-gradient(135deg, #10b981, #059669) !important; color: white !important;">
                    <i data-lucide="check-circle"></i> <span data-i18n-key="transport_accept_btn">Accept & Request Driver</span>
                </button>
            </div>

            <div class="transport-alert info" id="transportStatusAlert" style="margin-top: 1.5rem; display: none; align-items: center; gap: 0.75rem; padding: 1rem 1.5rem; border-radius: 1.25rem; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); color: #2563eb; font-weight: 600;">
                <i data-lucide="loader-2" class="lucide-spin" style="width: 20px; height: 20px;"></i>
                <span data-i18n-key="transport_req_success">Request sent! Searching for a driver...</span>
            </div>
        </div>

        <!-- Apply as Driver Section -->
        <div class="glass-card" style="padding: 3rem 2.5rem; border-radius: 2.5rem; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; background: linear-gradient(135deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.1)); border: 1.5px solid rgba(255, 255, 255, 0.25);">
            <div style="position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: linear-gradient(90deg, #10b981, #059669);"></div>
            <div>
                <h2 style="font-size: 1.8rem; font-weight: 700; display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem;">
                    <i data-lucide="steering-wheel" style="color: #10b981; width: 28px; height: 28px;"></i>
                    <span data-i18n-key="transport_driver_title">Apply as Driver</span>
                </h2>
                
                <form id="transportDriverForm">
                    <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem;">
                        <label style="font-weight: 600; font-size: 0.9rem; color: var(--text-dark);" data-i18n-key="transport_driver_name">Full Name</label>
                        <input type="text" id="driverName" class="pill-input" required style="width: 100%; padding: 0.8rem 1.2rem; border-radius: 9999px; border: 1px solid rgba(0, 0, 0, 0.1); background: rgba(255, 255, 255, 0.5); font-family: inherit; font-size: 0.95rem;" />
                    </div>
                    
                    <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem;">
                        <label style="font-weight: 600; font-size: 0.9rem; color: var(--text-dark);" data-i18n-key="transport_driver_phone">Phone Number</label>
                        <input type="tel" id="driverPhone" class="pill-input" required style="width: 100%; padding: 0.8rem 1.2rem; border-radius: 9999px; border: 1px solid rgba(0, 0, 0, 0.1); background: rgba(255, 255, 255, 0.5); font-family: inherit; font-size: 0.95rem;" />
                    </div>

                    <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 2rem;">
                        <label style="font-weight: 600; font-size: 0.9rem; color: var(--text-dark);" data-i18n-key="transport_driver_vehicle">Vehicle Type (e.g., Truck with Trailer)</label>
                        <input type="text" id="driverVehicle" class="pill-input" required style="width: 100%; padding: 0.8rem 1.2rem; border-radius: 9999px; border: 1px solid rgba(0, 0, 0, 0.1); background: rgba(255, 255, 255, 0.5); font-family: inherit; font-size: 0.95rem;" />
                    </div>

                    <button type="submit" class="pill-btn success" style="width: 100%; justify-content: center; font-size: 1rem; padding: 14px; background: linear-gradient(135deg, #10b981, #059669) !important; color: white !important;">
                        <i data-lucide="send"></i> <span data-i18n-key="transport_driver_btn">Submit Application</span>
                    </button>
                </form>
            </div>

            <div class="transport-alert success" id="driverStatusAlert" style="margin-top: 1.5rem; display: none; align-items: center; gap: 0.75rem; padding: 1rem 1.5rem; border-radius: 1.25rem; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); color: #059669; font-weight: 600;">
                <i data-lucide="check-circle" style="width: 20px; height: 20px;"></i>
                <span data-i18n-key="transport_driver_applied">Application submitted! We will contact you shortly.</span>
            </div>
        </div>
    </div>
</div>
