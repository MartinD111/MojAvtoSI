<style>
    @media (max-width: 600px) {
        #evaluationForm {
            padding: 1.25rem !important;
        }
        #evaluationForm .form-row {
            gap: 0.5rem !important;
            margin-bottom: 0.5rem !important;
        }
        #evaluationForm .search-actions {
            margin-top: 1rem !important;
        }
        #evaluationForm .form-group {
            gap: 0.25rem !important;
            align-items: center !important;
            text-align: center !important;
        }
        #evaluationForm .form-group label {
            text-align: center !important;
            width: 100%;
        }
        #evaluationForm .pill-input-wrapper {
            width: 100% !important;
        }
        #evaluationForm .pill-input {
            text-align: center !important;
        }
        #evaluationForm .custom-select-trigger {
            justify-content: center !important;
        }
        #evaluationForm .custom-select-value {
            margin-left: auto;
            margin-right: auto;
        }
        #evaluationForm .custom-select-trigger .select-icon {
            margin-left: 0;
        }
    }
</style>

<div class="search-container" style="max-width:800px; margin:3rem auto; padding:0 1rem;">
    <h1 class="hero-title text-center" style="font-size: 2.5rem; margin-bottom: 1rem;">
        <span data-i18n-key="eval_page_title_prefix">Oceni vrednost </span><span class="text-gradient" data-i18n-key="eval_page_title_highlight">mojega avta</span>
    </h1>
    <p class="text-center" style="color: #6b7280; margin-bottom: 2rem; font-size: 1.1rem;" data-i18n-key="eval_page_desc">Vnesite osnovne podatke vašega vozila in ugotovite njegovo trenutno tržno vrednost glede na podobna vozila na naši platformi.</p>

    <!-- Evaluation Form -->
    <form id="evaluationForm" class="glass-card" style="padding: 2.5rem; border-radius: 2.5rem; margin-bottom: 2rem;">
        <div class="form-row" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom:2rem;">
            <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label for="eval-make" style="font-weight: 600; font-size: 0.875rem;" data-i18n-key="cl_make">Znamka</label>
                <select id="eval-make" name="make" class="glass-select" required>
                    <option value="" data-i18n-key="cl_select_make">Izberite znamko</option>
                </select>
            </div>
            <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label for="eval-model" style="font-weight: 600; font-size: 0.875rem;" data-i18n-key="cl_model">Model</label>
                <select id="eval-model" name="model" class="glass-select" disabled required>
                    <option value="" data-i18n-key="cl_select_model">Izberite model</option>
                </select>
            </div>
        </div>

        <div class="form-row" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom:2rem;">
            <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label for="eval-year" style="font-weight: 600; font-size: 0.875rem;" data-i18n-key="cl_year">Letnik</label>
                <select id="eval-year" name="year" class="glass-select" required>
                    <option value="" data-i18n-key="cl_select_year">Izberite letnik</option>
                </select>
            </div>
            <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label for="eval-mileage" style="font-weight: 600; font-size: 0.875rem;" data-i18n-key="eval_mileage_label">Prevoženi kilometri (približno)</label>
                <div class="pill-input-wrapper">
                    <input type="text" id="eval-mileage" name="mileage" class="pill-input js-format-number" placeholder="npr. 150,000" data-i18n-key="eval_mileage_placeholder" data-i18n-target="placeholder" inputmode="numeric" required>
                </div>
            </div>
        </div>

        <div class="search-actions" style="margin-top:2rem; display:flex; justify-content: center;">
            <button type="submit" class="search-submit-btn pill-btn primary" id="evalBtn" style="padding: 0 4rem; max-width: 400px;">
                <i data-lucide="calculator"></i>
                <span id="eval-btn-text" data-i18n-key="eval_btn_text">Izračunaj vrednost</span>
            </button>
        </div>
    </form>

    <!-- Evaluation Results -->
    <div id="evaluation-results" style="display: none; animation: slideDown 0.3s ease-out;">
        <div class="glass-card text-center" style="padding: 3rem 2rem; border-radius: 2.5rem; background: linear-gradient(135deg, rgba(234, 88, 12, 0.05), rgba(79, 70, 229, 0.05)); border: 2px solid rgba(234, 88, 12, 0.2);">
            <h2 style="font-size: 1.5rem; color: #374151; margin-bottom: 0.5rem;" data-i18n-key="eval_results_title">Ocenjena tržna vrednost:</h2>
            <div id="est-price-container" style="font-size: 3.5rem; font-weight: 800; color: var(--color-primary-start); margin-bottom: 1rem; text-shadow: 0 2px 10px rgba(234,88,12,0.2);">
                -- €
            </div>
            <p id="est-details" style="color: #6b7280; font-size: 1rem; margin-bottom: 2rem;">
                <span data-i18n-key="eval_results_desc_prefix">Na podlagi primerjave </span><span id="est-count" style="font-weight:bold;">0</span><span data-i18n-key="eval_results_desc_suffix"> podobnih vozil (+/- 2 leti).</span>
            </p>
            
            <h3 style="font-size: 1.25rem; font-weight: 600; color: #374151; margin-bottom: 1rem; text-align: left;" data-i18n-key="eval_similar_title">Podobna vozila na portalu:</h3>
            <div class="listings-grid" id="comp-results-container" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:1rem; text-align: left;">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>
</div>
