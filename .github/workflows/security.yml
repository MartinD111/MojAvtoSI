# Supply-chain + secret scanning in CI (#1, #3).
# Runs on every push/PR. Fails the build on a leaked secret or a high/critical
# vulnerability, and enforces that the committed lockfiles are in sync.
name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 } # full history so historical leaks are caught
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  audit:
    name: npm audit + lockfile integrity
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [".", "server"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # `npm ci` requires an in-sync package-lock.json and fails otherwise —
      # this enforces "strictly use the lockfile" (#1).
      - name: Install from lockfile
        working-directory: ${{ matrix.dir }}
        run: npm ci
      - name: Audit (fail on high/critical)
        working-directory: ${{ matrix.dir }}
        run: npm audit --audit-level=high

  # Optional deeper scan — runs only if a SNYK_TOKEN secret is configured.
  snyk:
    name: snyk
    runs-on: ubuntu-latest
    if: ${{ secrets.SNYK_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high
