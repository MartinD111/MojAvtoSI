<div class="home-container">
    <div class="glass-hero navtika-sea-hero">
        <style>
            .navtika-sea-hero {
                position: relative;
                overflow: hidden;
                min-height: 220px;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem 1rem 4.5rem;
            }
            /* Ocean waves */
            .sea-waves {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 90px;
                pointer-events: none;
                z-index: 0;
                /* Fade into background: bottom solid, sides transparent, top transparent */
                -webkit-mask-image: linear-gradient(to top, black 0%, black 55%, transparent 100%),
                                    linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%);
                -webkit-mask-composite: source-in;
                mask-image: linear-gradient(to top, black 0%, black 55%, transparent 100%),
                            linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%);
                mask-composite: intersect;
            }
            .sea-wave {
                position: absolute;
                bottom: 0;
                left: -50%;
                width: 200%;
                height: 100%;
            }
            .sea-wave svg {
                width: 100%;
                height: 100%;
                display: block;
            }
            .sea-wave--1 {
                animation: waveMove1 4s ease-in-out infinite;
                opacity: 0.7;
            }
            .sea-wave--2 {
                animation: waveMove2 5.5s ease-in-out infinite;
                opacity: 0.45;
                bottom: 10px;
            }
            .sea-wave--3 {
                animation: waveMove3 3.5s ease-in-out infinite;
                opacity: 0.3;
                bottom: 20px;
            }
            .sea-wave--4 {
                animation: waveMove4 6s ease-in-out infinite;
                opacity: 0.2;
                bottom: 30px;
            }
            @keyframes waveMove1 {
                0%   { transform: translateX(0)    scaleY(1); }
                25%  { transform: translateX(6%)   scaleY(1.08); }
                50%  { transform: translateX(12%)  scaleY(0.95); }
                75%  { transform: translateX(5%)   scaleY(1.05); }
                100% { transform: translateX(0)    scaleY(1); }
            }
            @keyframes waveMove2 {
                0%   { transform: translateX(0)    scaleY(1); }
                30%  { transform: translateX(-9%)  scaleY(1.1); }
                60%  { transform: translateX(-16%) scaleY(0.9); }
                100% { transform: translateX(0)    scaleY(1); }
            }
            @keyframes waveMove3 {
                0%   { transform: translateX(0)   scaleY(1); }
                40%  { transform: translateX(10%) scaleY(1.15); }
                70%  { transform: translateX(4%)  scaleY(0.88); }
                100% { transform: translateX(0)   scaleY(1); }
            }
            @keyframes waveMove4 {
                0%   { transform: translateX(0)    scaleY(1); }
                50%  { transform: translateX(-12%) scaleY(1.2); }
                100% { transform: translateX(0)    scaleY(1); }
            }
            /* Funny message */
            .sea-joke-wrap {
                position: relative;
                z-index: 1;
                text-align: center;
                max-width: 680px;
            }
            .sea-joke-label {
                font-size: 0.72rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.12em;
                color: var(--color-primary-start, #5eaeff);
                opacity: 0.75;
                margin-bottom: 0.5rem;
            }
            .sea-joke-text {
                font-size: clamp(1.25rem, 3.5vw, 2rem);
                font-weight: 800;
                color: var(--text-primary, #fff);
                line-height: 1.3;
                min-height: 2.7em;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: opacity 0.4s ease;
            }
            .sea-joke-text.fading { opacity: 0; }
            .sea-joke-quote {
                font-size: clamp(1rem, 2.5vw, 1.4rem);
                color: var(--text-muted, #94a3b8);
                margin-top: 0.6rem;
                font-style: italic;
            }
        </style>

        <!-- Ocean wave animation -->
        <div class="sea-waves" aria-hidden="true">
            <!-- Wave 1: sharp choppy crests, front layer -->
            <div class="sea-wave sea-wave--1">
                <svg viewBox="0 0 1440 90" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0,60 C60,40 100,80 160,55 C220,30 260,75 320,50 C380,25 420,70 490,45 C560,20 600,72 660,48 C720,24 770,78 840,52 C910,26 950,68 1020,44 C1090,20 1130,74 1200,50 C1270,26 1320,65 1380,48 C1410,40 1430,55 1440,50 L1440,90 L0,90 Z" fill="var(--color-primary-start,#3b82f6)" />
                </svg>
            </div>
            <!-- Wave 2: mid layer, different rhythm -->
            <div class="sea-wave sea-wave--2">
                <svg viewBox="0 0 1440 90" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0,50 C80,20 130,75 200,45 C270,15 310,70 390,42 C470,14 520,68 600,40 C680,12 730,72 810,46 C890,20 940,65 1020,38 C1100,11 1150,66 1230,42 C1310,18 1380,60 1440,45 L1440,90 L0,90 Z" fill="var(--color-primary-start,#3b82f6)" />
                </svg>
            </div>
            <!-- Wave 3: tight choppy peaks -->
            <div class="sea-wave sea-wave--3">
                <svg viewBox="0 0 1440 90" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0,65 C40,50 70,80 110,58 C150,36 180,72 230,52 C280,32 310,68 370,50 C430,32 460,70 520,52 C580,34 610,72 670,54 C730,36 760,70 830,50 C900,30 940,72 1010,52 C1080,32 1110,68 1180,50 C1250,32 1300,70 1360,52 C1400,40 1425,60 1440,55 L1440,90 L0,90 Z" fill="var(--color-primary-start,#3b82f6)" />
                </svg>
            </div>
            <!-- Wave 4: deep background swell -->
            <div class="sea-wave sea-wave--4">
                <svg viewBox="0 0 1440 90" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0,70 C120,30 240,85 360,55 C480,25 600,80 720,55 C840,30 960,78 1080,55 C1200,32 1320,72 1440,55 L1440,90 L0,90 Z" fill="var(--color-primary-start,#3b82f6)" />
                </svg>
            </div>
        </div>

        <!-- Rotating funny boat name joke -->
        <div class="sea-joke-wrap">
<div class="sea-joke-text" id="seaJokeText"></div>
            <div class="sea-joke-quote" id="seaJokeQuote"></div>
        </div>

    </div>

    <div class="home-search-mode" id="homeSearchMode">
        <button type="button" class="home-search-mode-pill active" data-search-mode="oglasi">
            <i data-lucide="search"></i>
            <span data-i18n-key="search_mode_listings">Išči oglase</span>
        </button>
        <button type="button" class="home-search-mode-pill" data-search-mode="drazbe">
            <i data-lucide="gavel"></i>
            <span data-i18n-key="search_mode_auctions">Išči dražbe</span>
        </button>
    </div>

    <!-- Simple vessel search: vrsta plovila + dolžina + moč motorja -->
    <div class="search-box-container">
        <form id="navtikaHomeSearch" class="search-box compact glass-card main-search-card card-squircle">
            <style>
                #navtikaHomeSearch .nh-row { display:flex; gap:1rem; align-items:flex-end; margin-bottom:1.25rem; flex-wrap:wrap; }
                #navtikaHomeSearch .nh-field { display:flex; flex-direction:column; gap:0.35rem; flex:1; min-width:140px; }
                #navtikaHomeSearch .nh-field label { font-size:0.78rem; font-weight:600; color:var(--text-muted,#64748b); letter-spacing:0.02em; text-align: center; width: 100%; }
                /* Length slider track */
                #navtikaHomeSearch .nh-slider-wrap { position:relative; height:24px; display: flex; align-items: center; width: 100%; margin: 0.25rem 0; }
                #navtikaHomeSearch .nh-slider-track { position: absolute; left: 0; right: 0; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.08); z-index: 1; pointer-events: none; }
                #navtikaHomeSearch .nh-slider { position: absolute; -webkit-appearance:none; appearance:none; width:100%; height:8px; background:transparent; outline:none; pointer-events: none; margin: 0; z-index: 3; }
                #navtikaHomeSearch .nh-slider::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:var(--color-primary-start); border:3.5px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,0.25); cursor:pointer; pointer-events: auto; position: relative; z-index: 4; margin-top: 0; }
                #navtikaHomeSearch .nh-slider::-moz-range-thumb { width:20px; height:20px; border-radius:50%; background:var(--color-primary-start); border:3.5px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,0.25); cursor:pointer; pointer-events: auto; position: relative; z-index: 4; }
                #navtikaHomeSearch .nh-slider-labels { display:flex; justify-content:space-between; font-size:0.72rem; color:var(--text-muted,#94a3b8); margin-top:0.4rem; }
                #navtikaHomeSearch .nh-slider-val { font-size:0.78rem; font-weight:700; color:var(--color-primary-start); }
                #navtikaHomeSearch .nh-actions { display:flex; gap:1rem; align-items:center; justify-content:center; margin-top:0.75rem; flex-wrap:wrap; }
                @media (max-width:600px) {
                    #navtikaHomeSearch .nh-row { flex-direction:column; align-items:stretch; }
                    #navtikaHomeSearch .pill-select-wrapper,
                    #navtikaHomeSearch .pill-input-wrapper { width: 100% !important; }
                    #navtikaHomeSearch .nh-actions { gap: 0.5rem !important; }
                    #navtikaHomeSearch .nh-actions button[type="reset"],
                    #navtikaHomeSearch .nh-actions #navHomeAdvLink {
                        flex: 1 1 calc(50% - 0.3rem) !important;
                        min-width: 0 !important;
                        max-width: 100% !important;
                    }
                    #navtikaHomeSearch .nh-actions .search-submit-btn {
                        flex: 1 1 100% !important;
                        max-width: 100% !important;
                        order: 3;
                    }
                }
            </style>

            <!-- Vrstica 1: Vrsta plovila · Moč motorja · Ure motorja -->
            <div class="nh-row">
                <div class="nh-field">
                    <label for="nav-home-cat">Vrsta plovila</label>
                    <div class="pill-select-wrapper">
                        <select id="nav-home-cat" name="cat" class="pill-input"></select>
                    </div>
                </div>
                <div class="nh-field">
                    <label for="nav-home-subcat">Kategorija</label>
                    <div class="pill-select-wrapper">
                        <select id="nav-home-subcat" name="subcat" class="pill-input" disabled></select>
                    </div>
                </div>
                <div class="nh-field">
                    <label for="nav-home-power-to">Moč motorja do (KM)</label>
                    <div class="pill-input-wrapper" style="width:100%;">
                        <input type="number" min="0" id="nav-home-power-to" name="powerTo" class="pill-input" placeholder="Brez omejitve">
                    </div>
                </div>
                <div class="nh-field">
                    <label for="nav-home-hours-to">Ure motorja do</label>
                    <div class="pill-input-wrapper" style="width:100%;">
                        <input type="number" min="0" id="nav-home-hours-to" name="engineHoursTo" class="pill-input" placeholder="Brez omejitve">
                    </div>
                </div>
            </div>

            <!-- Vrstica 2: Dolžina slider -->
            <div style="margin-bottom:1.25rem;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
                    <label style="font-size:0.78rem; font-weight:600; color:var(--text-muted,#64748b); letter-spacing:0.02em;">Dolžina plovila</label>
                    <span class="nh-slider-val" id="navHomeLengthVal"><strong id="navHomeLengthMinDisplay">3</strong> - <strong id="navHomeLengthMaxDisplay">30</strong> m</span>
                </div>
                <div class="nh-slider-wrap" id="navHomeSliderWrap">
                    <div class="nh-slider-track" id="navHomeSliderTrack"></div>
                    <input type="range" id="nav-home-length-from" name="lengthFrom" min="3" max="50" value="3" step="1" class="nh-slider">
                    <input type="range" id="nav-home-length-to" name="lengthTo" min="3" max="50" value="30" step="1" class="nh-slider">
                </div>
                <div class="nh-slider-labels" style="position:relative;height:1.2em;margin-top:0.4rem;">
                    <span style="position:absolute;left:0%;transform:translateX(0%);">3 m</span>
                    <span style="position:absolute;left:25.53%;transform:translateX(-50%);">15 m</span>
                    <span style="position:absolute;left:57.45%;transform:translateX(-50%);">30 m</span>
                    <span style="position:absolute;left:100%;transform:translateX(-100%);">50 m</span>
                </div>
            </div>

            <!-- Vrstica 3: Prodaja / Najem toggles -->
            <div style="display:flex; justify-content:center; margin-bottom:1rem;">
                <div style="display:flex; flex-direction:row; flex-wrap:nowrap; gap:2rem; align-items:center;">
                    <label style="display:inline-flex; flex-direction:row; flex-wrap:nowrap; align-items:center; gap:0.5rem; cursor:pointer;">
                        <input type="checkbox" class="remember-check" id="homeNavProdajaToggle" checked style="display:none;">
                        <span class="toggle-slider" style="width:32px; height:18px; flex-shrink:0;"></span>
                        <span style="font-size:0.7rem; font-weight:700; color:var(--text-muted,#64748b); text-transform:uppercase; letter-spacing:0.025em; white-space:nowrap;">Prodaja</span>
                    </label>
                    <label style="display:inline-flex; flex-direction:row; flex-wrap:nowrap; align-items:center; gap:0.5rem; cursor:pointer;">
                        <input type="checkbox" class="remember-check" id="homeNavNajemToggle" style="display:none;">
                        <span class="toggle-slider" style="width:32px; height:18px; flex-shrink:0;"></span>
                        <span style="font-size:0.7rem; font-weight:700; color:var(--text-muted,#64748b); text-transform:uppercase; letter-spacing:0.025em; white-space:nowrap;">Najem</span>
                    </label>
                </div>
            </div>

            <!-- Vrstica 4: 3 gumbi -->
            <div class="nh-actions">
                <button type="reset" class="pill-btn secondary" style="flex: 1; min-width: 140px; max-width: 240px; justify-content: center; gap: 0.4rem;" title="Ponastavi">
                    <i data-lucide="refresh-cw" style="width:16px;height:16px;"></i> Ponastavi
                </button>
                <button type="button" class="pill-btn secondary" id="navHomeAdvLink" style="flex: 1; min-width: 140px; max-width: 240px; justify-content: center; gap: 0.4rem;" title="Več filtrov">
                    <i data-lucide="sliders-horizontal" style="width:16px;height:16px;"></i> Več filtrov
                </button>
                <button type="submit" class="pill-btn primary search-submit-btn" style="flex: 1; min-width: 140px; max-width: 240px; justify-content: center; gap: 0.5rem;">
                    <i data-lucide="search" style="width:16px;height:16px;"></i> Išči plovila
                </button>
            </div>
        </form>

        <div class="secondary-actions-container">
            <a href="#/oceni-vrednost" class="footer-pill evaluation-pill pill-btn btn-sm" title="Ocenite vrednost mojega plovila">
                <i data-lucide="calculator"></i>
                <span data-i18n-key="evaluate_vehicle_btn">Ocenite vrednost mojega plovila</span>
            </a>
        </div>
    </div>
</div>

<!-- Sponsored / rotating ads -->
<div class="page-container" style="margin-top:2rem; flex-direction:column;">
    <section id="sponsored-section" class="carousel-section">
        <span class="sponsored-badge" style="position:static;display:block;text-align:right;margin-bottom:0.5rem;" data-i18n-key="sponsored_label">Sponzorirano</span>
        <div class="carousel-wrapper">
            <button class="carousel-btn prev" id="rot-prev-btn" aria-label="Prejšnji">&#10094;</button>
            <div class="carousel-track-container" style="mask-image:linear-gradient(to right,transparent,black 5%,black 95%,transparent);-webkit-mask-image:linear-gradient(to right,transparent,black 5%,black 95%,transparent);">
                <div class="carousel-track" id="rotating-ads-container"></div>
            </div>
            <button class="carousel-btn next" id="rot-next-btn" aria-label="Naslednji">&#10095;</button>
        </div>
    </section>
</div>

<!-- Featured listings -->
<div class="page-container" style="margin-top:2rem; flex-direction:column;">
    <section id="featured-section" class="carousel-section" style="display:none;">
        <h2 data-i18n-key="featured_title">Izpostavljeni oglasi</h2>
        <div class="carousel-wrapper">
            <button class="carousel-btn prev" id="featured-prev-btn" aria-label="Prejšnji">&#10094;</button>
            <div class="carousel-track-container">
                <div class="carousel-track" id="featured-container"></div>
            </div>
            <button class="carousel-btn next" id="featured-next-btn" aria-label="Naslednji">&#10095;</button>
        </div>
    </section>
</div>
