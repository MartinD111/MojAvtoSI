<div class="home-container">
    <div class="glass-hero">
        <h1 class="hero-title">
            <div class="hero-title-line1">
                <span data-i18n-key="hero_let_your_next">Naj vas vaše naslednje</span>
            </div>
            <div class="hero-word-slider">
                <div class="hero-word-items">
                    <span data-i18n-key="hero_word_car">plovilo</span>
                    <span data-i18n-key="hero_word_motorcycle">jadrnica</span>
                    <span data-i18n-key="hero_word_truck">čoln</span>
                    <span data-i18n-key="hero_word_forklift">jahta</span>
                    <span data-i18n-key="hero_word_jetski">jet-ski</span>
                    <span data-i18n-key="hero_word_snowmobile">gumenjak</span>
                    <span data-i18n-key="hero_word_tractor">katamaran</span>
                    <span data-i18n-key="hero_word_bus">motorni čoln</span>
                    <span data-i18n-key="hero_word_van">RIB</span>
                    <span data-i18n-key="hero_word_rv">izvenkrmni motor</span>
                    <span data-i18n-key="hero_word_car_loop">plovilo</span>
                </div>
            </div>
            <style>
                .hero-word-items { display:flex; flex-direction:column; gap:0; margin:0; padding:0; animation:none; transform:translateY(0); }
                .hero-word-items span { display:flex !important; align-items:center !important; justify-content:center !important; height:1.4em !important; min-height:1.4em !important; max-height:1.4em !important; line-height:1.4em !important; margin:0 !important; padding:0 !important; border:none !important; box-sizing:border-box !important; white-space:nowrap !important; color:inherit !important; }
            </style>
            <div class="hero-title-line2">
                <span class="text-gradient" data-i18n-key="hero_find_you">najde</span>
            </div>
        </h1>
    </div>

    <!-- Simple vessel search: vrsta plovila + dolžina + moč motorja -->
    <div class="search-box-container">
        <form id="navtikaHomeSearch" class="search-box compact glass-card main-search-card card-squircle">
            <style>
                #navtikaHomeSearch .nh-row { display:flex; gap:1rem; align-items:flex-end; margin-bottom:1.25rem; flex-wrap:wrap; }
                #navtikaHomeSearch .nh-field { display:flex; flex-direction:column; gap:0.35rem; flex:1; min-width:140px; }
                #navtikaHomeSearch .nh-field label { font-size:0.78rem; font-weight:600; color:var(--text-muted,#64748b); letter-spacing:0.02em; }
                /* Length slider track */
                #navtikaHomeSearch .nh-slider-wrap { position:relative; padding:0.5rem 0 0.25rem; }
                #navtikaHomeSearch .nh-slider { -webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:2px; background:linear-gradient(to right, var(--color-primary-start) var(--sl-pct,40%), rgba(0,0,0,0.08) var(--sl-pct,40%)); outline:none; cursor:pointer; }
                #navtikaHomeSearch .nh-slider::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--color-primary-start); border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,0.2); cursor:pointer; }
                #navtikaHomeSearch .nh-slider::-moz-range-thumb { width:18px; height:18px; border-radius:50%; background:var(--color-primary-start); border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,0.2); cursor:pointer; }
                #navtikaHomeSearch .nh-slider-labels { display:flex; justify-content:space-between; font-size:0.72rem; color:var(--text-muted,#94a3b8); margin-top:0.2rem; }
                #navtikaHomeSearch .nh-slider-val { font-size:0.78rem; font-weight:700; color:var(--color-primary-start); }
                #navtikaHomeSearch .nh-actions { display:flex; gap:0.6rem; align-items:center; margin-top:0.25rem; }
                @media (max-width:600px) { #navtikaHomeSearch .nh-row { flex-direction:column; } }
            </style>

            <!-- Vrstica 1: Vrsta plovila · Moč motorja · Ure motorja -->
            <div class="nh-row">
                <div class="nh-field" style="flex:2;">
                    <label for="nav-home-cat">Vrsta plovila</label>
                    <div class="pill-select-wrapper">
                        <select id="nav-home-cat" name="cat" class="pill-input"></select>
                    </div>
                </div>
                <div class="nh-field">
                    <label for="nav-home-power-to">Moč motorja do (KM)</label>
                    <div class="pill-input-wrapper" style="width:100%;">
                        <input type="number" min="0" id="nav-home-power-to" name="powerTo" class="pill-input" placeholder="Brez omejitve">
                    </div>
                </div>
                <div class="nh-field">
                    <label for="nav-home-hours-to">Ure motorja do</label>
                    <div class="pill-input-wrapper" style="width:100%;">
                        <input type="number" min="0" id="nav-home-hours-to" name="engineHoursTo" class="pill-input" placeholder="Brez omejitve">
                    </div>
                </div>
            </div>

            <!-- Vrstica 2: Dolžina slider -->
            <div style="margin-bottom:1.25rem;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
                    <label style="font-size:0.78rem; font-weight:600; color:var(--text-muted,#64748b); letter-spacing:0.02em;">Dolžina plovila</label>
                    <span class="nh-slider-val" id="navHomeLengthVal">do <strong id="navHomeLengthDisplay">30</strong> m</span>
                </div>
                <div class="nh-slider-wrap">
                    <input type="range" id="nav-home-length-to" name="lengthTo" min="3" max="50" value="30" step="1" class="nh-slider">
                </div>
                <div class="nh-slider-labels"><span>3 m</span><span>15 m</span><span>30 m</span><span>50 m</span></div>
                <input type="hidden" id="nav-home-length-from" name="lengthFrom" value="">
            </div>

            <!-- Vrstica 3: 3 gumbi -->
            <div class="nh-actions">
                <button type="reset" class="pill-btn secondary btn-sm" style="gap:0.4rem;" title="Ponastavi">
                    <i data-lucide="refresh-cw" style="width:15px;height:15px;"></i> Ponastavi
                </button>
                <a href="#/iskanje?cat=colni" class="pill-btn secondary btn-sm" id="navHomeAdvLink" style="gap:0.4rem; text-decoration:none;" title="Napredna iskanje">
                    <i data-lucide="sliders-horizontal" style="width:15px;height:15px;"></i> Napredna iskanje
                </a>
                <button type="submit" class="pill-btn primary search-submit-btn" style="flex:1; gap:0.5rem;">
                    <i data-lucide="search" style="width:16px;height:16px;"></i> Išči plovila
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Sponsored / rotating ads -->
<div class="ad-banner-container rotating-ads-carousel">
    <span class="sponsored-badge" data-i18n-key="sponsored_label">Sponzorirano</span>
    <button class="carousel-btn prev" id="rot-prev-btn" aria-label="Prejšnji">&#10094;</button>
    <div class="rotating-ads-track-container">
        <div class="rotating-ads-track" id="rotating-ads-container"></div>
    </div>
    <button class="carousel-btn next" id="rot-next-btn" aria-label="Naslednji">&#10095;</button>
</div>

<!-- Featured listings -->
<div class="page-container" style="margin-top:2rem; flex-direction:column;">
    <section id="featured-section" class="carousel-section" style="display:none;">
        <h2 data-i18n-key="featured_title">Izpostavljeni oglasi</h2>
        <div class="carousel-wrapper">
            <button class="carousel-btn prev" id="featured-prev-btn" aria-label="Prejšnji">&#10094;</button>
            <div class="carousel-track-container">
                <div class="carousel-track" id="featured-container"></div>
            </div>
            <button class="carousel-btn next" id="featured-next-btn" aria-label="Naslednji">&#10095;</button>
        </div>
    </section>
</div>
